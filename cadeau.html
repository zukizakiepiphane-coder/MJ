<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Amie Spéciale 💝</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff1493 0%, #ff6347 25%, #ffa500 50%, #00bfff 75%, #32cd32 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .gift-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff1493 0%, #ff6347 25%, #ffa500 50%, #00bfff 75%, #32cd32 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        .gift-wrapper.opened {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .gift-box-open {
            position: relative;
            cursor: pointer;
            perspective: 1000px;
        }

        .gift-box-visual {
            position: relative;
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.6s ease;
            transform-style: preserve-3d;
        }

        .gift-box-open:hover .gift-box-visual {
            transform: translateY(-10px) rotateX(10deg);
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        }

        .gift-box-visual::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 200px;
            background: linear-gradient(90deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .gift-icon {
            font-size: 5em;
            z-index: 2;
            transition: transform 0.6s ease;
        }

        .gift-box-open:hover .gift-icon {
            transform: scale(1.1);
        }

        .gift-text {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: bounce 1.5s ease-in-out infinite;
        }

        .page-title {
            background: linear-gradient(90deg, #ff1493, #ff6347, #ffa500, #00bfff, #32cd32, #ff1493);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: colorShift 8s ease-in-out infinite;
            font-weight: bold;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-10px);
            }
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .title {
            color: white;
            font-size: 2em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: fadeInDown 1s ease-out;
        }

        .gift-box {
            position: relative;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .carousel-circle {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 50%;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .carousel-inner {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .photo-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            top: 0;
            left: 0;
        }

        .photo-slide.active {
            opacity: 1;
        }

        .photo-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .poem-section {
            position: relative;
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 100%;
        }

        .poem-text {
            font-size: 0.95em;
            line-height: 1.4;
            font-style: italic;
            font-weight: 600;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: linear-gradient(90deg, #ff1493, #ff6347, #ffa500, #00bfff, #32cd32, #ff1493);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: colorShift 8s ease-in-out infinite;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        @keyframes colorShift {
            0% {
                background-position: 0% center;
            }
            50% {
                background-position: 100% center;
            }
            100% {
                background-position: 0% center;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 8px 16px;
            font-size: 0.9em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease;
            border: 2px solid white;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .audio-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: white;
            font-size: 1.5em;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .audio-control:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .counter {
            color: white;
            font-size: 0.9em;
            margin-top: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        audio {
            display: none;
        }

        .heart-rain {
            position: fixed;
            pointer-events: none;
        }

        .heart {
            position: fixed;
            color: #ff6b9d;
            font-size: 2em;
            opacity: 0.7;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .firework {
            position: fixed;
            pointer-events: none;
        }

        .flower {
            position: fixed;
            font-size: 2.5em;
            opacity: 0.8;
            animation: flowerfalldown 4s ease-in forwards;
            pointer-events: none;
        }

        @keyframes flowerfalldown {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(360deg) scale(0.5);
            }
        }

        .spark {
            position: fixed;
            pointer-events: none;
        }

        @keyframes sparkExplode {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }
    </style>
</head>
<body>
    <!-- Écran d'ouverture du cadeau -->
    <div class="gift-wrapper" id="giftWrapper">
        <div class="gift-box-open" onclick="openGift()">
            <div class="gift-box-visual">
                <div class="gift-icon">🎁</div>
            </div>
            <div class="gift-text">Pour toi Ma joue</div>
        </div>
    </div>

    <div class="container">
        <h1 class="title page-title">Pour toi Ma joue 💝</h1>
        
        <div class="gift-box">
            <div class="carousel-circle">
                <div class="carousel-inner" id="carouselInner">
                    <!-- Les photos vont être insérées ici par JavaScript -->
                </div>
            </div>
            <div class="poem-section">
                <div class="poem-text" id="poemText"></div>
            </div>
        </div>

        <div class="counter">
            <span id="currentSlide">1</span> / <span id="totalSlides">4</span>
        </div>

        <div class="controls">
            <button onclick="previousSlide()">← Précédent</button>
            <button onclick="nextSlide()">Suivant →</button>
        </div>

        <div class="audio-control" id="audioControl" onclick="toggleAudio()">
            🔊
        </div>
    </div>

    <audio id="audioPlayer" loop>
        <source src="DADJU - Reine (Clip Officiel).mp3" type="audio/mpeg">
    </audio>

    <script>
        // Les photos
        const photos = [
            'IMG-20260219-WA0151.jpg',
            'IMG-20260221-WA0194.jpg',
            'IMG-20260223-WA0004.jpg',
            'IMG-20260223-WA0028.jpg'
        ];

        // Les poèmes d'amitié
        const poems = [
            "Une amie est un trésor précieux,\nDans mon cœur, tu es celle qui brille le plus.",
            "Notre amitié est comme une fleur,\nQui s'épanouit chaque jour avec plus de couleur.",
            "Avec toi, chaque moment devient magique,\nNotre amitié est vraiment fantastique.",
            "Tu es ma confidente, ma soeur du cœur,\nAvec toi, je trouve le vrai bonheur."
        ];

        let currentIndex = 0;
        let autoPlayInterval;
        let isPlaying = false;

        const carouselInner = document.getElementById('carouselInner');
        const audioPlayer = document.getElementById('audioPlayer');
        const audioControl = document.getElementById('audioControl');
        const totalSlides = document.getElementById('totalSlides');
        const currentSlide = document.getElementById('currentSlide');

        // Initialiser le carrousel
        function initCarousel() {
            photos.forEach((photo, index) => {
                const slide = document.createElement('div');
                slide.className = 'photo-slide' + (index === 0 ? ' active' : '');
                
                const img = document.createElement('img');
                img.src = photo;
                img.alt = `Photo ${index + 1}`;
                
                slide.appendChild(img);
                carouselInner.appendChild(slide);
            });

            totalSlides.textContent = photos.length;
            updatePoem();
            startAutoPlay();
        }

        // Démarrer le défilement automatique
        function startAutoPlay() {
            autoPlayInterval = setInterval(() => {
                nextSlide();
            }, 5000); // Changer toutes les 5 secondes
        }

        // Arrêter le défilement automatique
        function stopAutoPlay() {
            clearInterval(autoPlayInterval);
        }

        // Mettre à jour le poème
        function updatePoem() {
            const poemText = document.getElementById('poemText');
            poemText.textContent = poems[currentIndex];
        }

        // Aller au suivant
        function nextSlide() {
            const slides = document.querySelectorAll('.photo-slide');
            
            slides[currentIndex].classList.remove('active');
            
            currentIndex = (currentIndex + 1) % slides.length;
            
            slides[currentIndex].classList.add('active');
            
            currentSlide.textContent = currentIndex + 1;
            updatePoem();
            
            stopAutoPlay();
            startAutoPlay();
        }

        // Aller au précédent
        function previousSlide() {
            const slides = document.querySelectorAll('.photo-slide');
            
            slides[currentIndex].classList.remove('active');
            
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            
            slides[currentIndex].classList.add('active');
            
            currentSlide.textContent = currentIndex + 1;
            updatePoem();
            
            stopAutoPlay();
            startAutoPlay();
        }

        // Contrôler l'audio
        function toggleAudio() {
            if (isPlaying) {
                audioPlayer.pause();
                audioControl.textContent = '🔇';
                isPlaying = false;
            } else {
                audioPlayer.play();
                audioControl.textContent = '🔊';
                isPlaying = true;
            }
        }

        // Créer des cœurs qui tombent
        function createHeartRain() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.textContent = '❤️';
                heart.style.left = Math.random() * window.innerWidth + 'px';
                heart.style.top = '-20px';
                heart.style.animationDuration = (2 + Math.random() * 2) + 's';
                document.body.appendChild(heart);
                
                setTimeout(() => heart.remove(), 4000);
            }, 300);
        }

        // Créer des feux d'artifice
        function createFireworks() {
            setInterval(() => {
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight * 0.6;
                
                for (let i = 0; i < 15; i++) {
                    const spark = document.createElement('div');
                    spark.classList.add('spark');
                    spark.textContent = '✨';
                    spark.style.left = x + 'px';
                    spark.style.top = y + 'px';
                    spark.style.fontSize = (1 + Math.random() * 1.5) + 'em';
                    
                    const angle = (i / 15) * Math.PI * 2;
                    const velocity = 50 + Math.random() * 100;
                    const tx = Math.cos(angle) * velocity;
                    const ty = Math.sin(angle) * velocity;
                    
                    spark.style.setProperty('--tx', tx + 'px');
                    spark.style.setProperty('--ty', ty + 'px');
                    spark.style.animation = `sparkExplode ${0.8 + Math.random() * 0.4}s ease-out forwards`;
                    
                    document.body.appendChild(spark);
                    setTimeout(() => spark.remove(), 1300);
                }
            }, 2000);
        }

        // Créer des fleurs qui tombent
        function createFlowerRain() {
            const flowers = ['🌸', '🌺', '🌻', '🌷', '🌹'];
            setInterval(() => {
                const flower = document.createElement('div');
                flower.classList.add('flower');
                flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
                flower.style.left = Math.random() * window.innerWidth + 'px';
                flower.style.top = '-50px';
                flower.style.animationDuration = (3 + Math.random() * 2) + 's';
                document.body.appendChild(flower);
                
                setTimeout(() => flower.remove(), 5000);
            }, 400);
        }

        // Fonction pour ouvrir le cadeau
        function openGift() {
            const giftWrapper = document.getElementById('giftWrapper');
            giftWrapper.classList.add('opened');
            
            // Lancer les feux d'artifice et les fleurs
            createFireworks();
            createFlowerRain();
            
            // Jouer la musique après ouverture
            setTimeout(() => {
                audioPlayer.play().catch(e => {
                    console.log("Autoplay bloqué, cliquez sur le bouton 🔊 pour lancer");
                });
                isPlaying = true;
            }, 500);
        }

        // Clavier - flèches pour naviguer
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') previousSlide();
        });
    </script>
</body>
</html>
